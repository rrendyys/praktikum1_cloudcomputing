<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Praktikum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab); /* Warna tema baru */
            color: white;
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
        }
        .btn {
            margin: 10px 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #1f1c2c;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .btn-secondary {
            margin: 10px 5px;
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Website Praktikum Cloud Computing</h1>
        <p>Website ini telah diperbarui menggunakan Continuous Deployment!</p>
        <hr style="border: 0.5px solid rgba(255,255,255,0.3); margin: 15px 0;">
        
        <!-- Data Diri Mahasiswa -->
        <p><b>Nama  :</b> Rendy Putra Setiawan</p>
        <p><b>NIM   :</b> 102042400016</p>
        <p><b>Kelas :</b> S1-SIKJ-24-05</p>
        
        <p id="time"></p>

        <!-- KODE TOMBOL DITARUH DI SINI -->
        <button class="btn" onclick="showMessage()">Cek Status Update</button>
        <a href="https://github.com" target="_blank"><button class="btn-secondary">Lihat GitHub</button></a>
    </div>

    <!-- KODE SCRIPT DITARUH DI BAGIAN BAWAH INI -->
    <script>
        function showMessage() {
            alert("Status: Pembaruan kode berhasil diterapkan secara otomatis di Vercel!");
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText = "Waktu sekarang: " + now.toLocaleString();
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
